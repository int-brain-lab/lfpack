project:
  type: website
  output-dir: _site

website:
  title: "lfpack"
  favicon: figures/favicon.png
  repo-url: https://github.com/int-brain-lab/lfpack
  navbar:
    left:
      - text: "Tutorial"
        file: tutorials/first-compression.qmd
      - text: "How-To"
        menu:
          - text: "BWM LFP dataset"
            file: how-to/bwm-dataset.qmd
          - text: "Read lfpack files"
            file: how-to/read-files.qmd
          - text: "Write your own file"
            file: how-to/write-your-own-file.qmd
      - text: "Pipeline and codec"
        file: explanation/pipeline.qmd
      - text: "Reference"
        menu:
          - text: "API"
            file: reference/index.qmd
          - text: "HDF5 format"
            file: reference/hdf5-layout.qmd
    right:
      - text: "Help"
        icon: question-circle
        href: https://github.com/int-brain-lab/lfpack/issues
      - icon: github
        href: https://github.com/int-brain-lab/lfpack

format:
  html:
    theme: minty
    toc: true
    code-copy: true
    code-overflow: wrap
    lightbox: true

quartodoc:
  package: lfpack
  dir: reference
  sidebar: reference/_sidebar.yml
  sections:
    - title: "Compression"
      desc: "Compress LFP recordings to HDF5."
      contents:
        - compress_bin_to_h5
        - compress_to_h5
        - compress_pipeline
        - compress
        - decompress
        - run_cadzow_checkpoint
    - title: "Data types"
      desc: "Core data structures."
      contents:
        - LFPCompressed
    - title: "Reader"
      desc: "Random-access decompression."
      contents:
        - LFPackReader
    - title: "Multi-recording archives"
      desc: "Combine, subset or upgrade archives without re-compressing."
      contents:
        - merge_h5
        - subset_h5
        - upgrade_h5
    - title: "Sync"
      desc: "Piecewise sample-to-time knots on a scale's meta group."
      contents:
        - write_sync_attrs
        - clear_sync_attrs